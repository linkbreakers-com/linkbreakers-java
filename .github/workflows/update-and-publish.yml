name: Update and Publish SDK

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install OpenAPI Generator
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Fetch current version from swagger
        id: fetch-version
        run: |
          SWAGGER_URL="https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json"
          NEW_VERSION=$(curl -fsS "$SWAGGER_URL" | jq -r '.info.version')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Swagger version: $NEW_VERSION"

      - name: Check whether Maven Central already has this version
        id: compare
        env:
          NEW_VERSION: ${{ steps.fetch-version.outputs.new_version }}
        run: |
          POM_URL="https://repo1.maven.org/maven2/com/linkbreakers/linkbreakers-sdk/$NEW_VERSION/linkbreakers-sdk-$NEW_VERSION.pom"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$POM_URL")
          case "$CODE" in
            200) echo "needs_update=false" >> $GITHUB_OUTPUT; echo "Maven Central already has $NEW_VERSION" ;;
            404) echo "needs_update=true" >> $GITHUB_OUTPUT; echo "Maven Central does not have $NEW_VERSION yet" ;;
            *) echo "Unexpected HTTP $CODE from $POM_URL" >&2; exit 1 ;;
          esac

      - name: Generate SDK
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.fetch-version.outputs.new_version }}
        run: |
          curl -fsS -o openapi-3.2.json https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json
          jq '.openapi = "3.1.0" | del(.jsonSchemaDialect)' openapi-3.2.json > openapi-3.1.json

          rm -rf src/main/java/com/linkbreakers
          openapi-generator-cli generate \
            -i openapi-3.1.json \
            -g java \
            -o . \
            -c openapi-config.yaml \
            -t templates \
            --skip-validate-spec \
            --git-host github.com \
            --git-user-id linkbreakers-com \
            --git-repo-id linkbreakers-java \
            --global-property apiTests=false,modelTests=false,apiDocs=false,modelDocs=false \
            --additional-properties=artifactVersion=$NEW_VERSION

          echo "$NEW_VERSION" > OPENAPI_VERSION
          rm openapi-3.2.json openapi-3.1.json

      - name: Import GPG key
        if: steps.compare.outputs.needs_update == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import

      - name: Build and sign
        if: steps.compare.outputs.needs_update == 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B clean verify -DskipTests -Psign-artifacts

      - name: Smoke check the README against the built SDK
        if: steps.compare.outputs.needs_update == 'true'
        run: ./scripts/check-docs.sh

      - name: Build the Central Portal bundle
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.fetch-version.outputs.new_version }}
        run: |
          ARTIFACT=linkbreakers-sdk
          DIR="target/bundle/com/linkbreakers/$ARTIFACT/$NEW_VERSION"
          mkdir -p "$DIR"
          for f in "$ARTIFACT-$NEW_VERSION.pom" "$ARTIFACT-$NEW_VERSION.jar" \
                   "$ARTIFACT-$NEW_VERSION-sources.jar" "$ARTIFACT-$NEW_VERSION-javadoc.jar"; do
            cp "target/$f" "target/$f.asc" "$DIR/"
            md5sum "target/$f" | cut -d' ' -f1 > "$DIR/$f.md5"
            sha1sum "target/$f" | cut -d' ' -f1 > "$DIR/$f.sha1"
          done
          (cd target/bundle && zip -qrD ../central-bundle.zip com)
          unzip -l target/central-bundle.zip

      - name: Publish to Maven Central
        if: steps.compare.outputs.needs_update == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          NEW_VERSION: ${{ steps.fetch-version.outputs.new_version }}
        run: |
          AUTH="Authorization: Bearer $(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          ID=$(curl -sS --fail-with-body -X POST -H "$AUTH" \
            -F "bundle=@target/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=linkbreakers-sdk-$NEW_VERSION&publishingType=AUTOMATIC")
          echo "Deployment $ID"
          for i in $(seq 1 90); do
            sleep 20
            STATUS=$(curl -sS --fail-with-body -X POST -H "$AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$ID")
            STATE=$(echo "$STATUS" | jq -r '.deploymentState')
            echo "$STATE"
            case "$STATE" in
              PUBLISHED) exit 0 ;;
              FAILED) echo "$STATUS" | jq . >&2; exit 1 ;;
            esac
          done
          echo "Deployment $ID was not published after 30 minutes" >&2
          exit 1

      - name: Commit, tag and push
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.fetch-version.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SDK to API version $NEW_VERSION"
          fi
          git push origin main
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null; then
            git tag "v$NEW_VERSION"
            git push origin "v$NEW_VERSION"
          fi

      - name: Close release failure issues
        if: success() && steps.compare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.fetch-version.outputs.new_version }}
        run: |
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Published $NEW_VERSION."
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.fetch-version.outputs.new_version || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="Publishing linkbreakers-sdk $NEW_VERSION to Maven Central failed. Run: $RUN_URL"
          echo "::error title=Release failed::$MESSAGE"
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The update and publish workflow failed" --force
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failure \
              --title "SDK release failing" --body "$MESSAGE"
          fi
